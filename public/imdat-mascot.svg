<svg width="200" height="320" viewBox="0 0 200 320" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">İmdat Hortumu - Acil Durum Fil Maskotu</title>
  <desc id="desc">Sevimli fil logosu - hortumu hafifçe sallanıyor ve üzerine gelince esniyor.</desc>

  <defs>
    <style>
      /* Yumuşak sallanma animasyonu */
      @keyframes trunkSwing {
        0%   { transform: rotate(-5deg); }
        50%  { transform: rotate(5deg); }
        100% { transform: rotate(-5deg); }
      }

      /* Dönüşüm ve esneme merkezleri başın ortasıdır */
      .interactive-trunk, #trunk-group {
        transform-origin: 105px 105px;
      }

      #trunk-group {
        animation: trunkSwing 4s ease-in-out infinite;
        transition: transform 0.3s ease-out;
      }

      /* Fareyle üzerine gelindiğinde İmdat Hortumu tepkisi */
      .interactive-trunk {
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Hortum aşağı doğru gerilir (PULL efekti) */
      .interactive-trunk:hover {
        transform: scaleY(1.06) translateY(3px);
      }

      /* Çekilme anında sallanma merkezde kilitlenir */
      .interactive-trunk:hover #trunk-group {
        animation-play-state: paused;
        transform: rotate(0deg);
      }

      /* Koyu mod desteği */
      @media (prefers-color-scheme: dark) {
        .light-bg { display: none; }
        .dark-bg { display: block; }
      }
    </style>
  </defs>

  <!-- Arka plan -->
  <rect width="200" height="320" rx="20" fill="#f8f9fa" class="light-bg"/>
  <rect width="200" height="320" rx="20" fill="#1a1a1a" class="dark-bg" style="display: none;"/>

  <!-- Platform (oturduğu çubuk) -->
  <rect x="40" y="92" width="120" height="18" rx="8" fill="#2c3e50"/>
  <rect x="40" y="92" width="120" height="18" rx="8" fill="#f39c12" opacity="0.15"/>

  <!-- Ana gövde -->
  <ellipse cx="102" cy="115" rx="48" ry="42" fill="#34495e"/>
  <ellipse cx="105" cy="128" rx="38" ry="28" fill="#2c3e50"/>

  <!-- Bacaklar -->
  <rect x="68" y="135" width="18" height="32" rx="8" fill="#34495e"/>
  <rect x="118" y="135" width="18" height="32" rx="8" fill="#34495e"/>

  <!-- Baş -->
  <circle cx="105" cy="75" r="38" fill="#34495e"/>

  <!-- Kulaklar -->
  <ellipse cx="68" cy="68" rx="22" ry="27" fill="#2c3e50" transform="rotate(-25 68 68)"/>
  <ellipse cx="66" cy="68" rx="13" ry="17" fill="#455a74" transform="rotate(-25 66 68)"/>
  <ellipse cx="138" cy="72" rx="18" ry="23" fill="#2c3e50" transform="rotate(30 138 72)"/>

  <!-- Gözler -->
  <circle cx="88" cy="68" r="6" fill="#111"/>
  <circle cx="89" cy="66" r="2.5" fill="#fff"/>
  <circle cx="122" cy="68" r="6" fill="#111"/>
  <circle cx="123" cy="66" r="2.5" fill="#fff"/>

  <!-- Kaşlar -->
  <path d="M80 58 Q88 53 95 57" stroke="#111" stroke-width="3" fill="none"/>
  <path d="M115 57 Q122 53 130 57" stroke="#111" stroke-width="3" fill="none"/>

  <!-- Ağız -->
  <path d="M85 88 Q105 95 125 88" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Diş -->
  <path d="M120 80 L125 88 L122 92 Z" fill="#ecf0f1"/>

  <!-- === İNTERAKTİF HORTUM GRUBU === -->
  <g class="interactive-trunk">
    <g id="trunk-group">
      <!-- Hortum ana gövde -->
      <path d="M105 105 Q125 145 95 190 Q75 235 105 255" fill="none" stroke="#34495e" stroke-width="26" stroke-linecap="round"/>

      <!-- Hortum iç vurgu -->
      <path d="M105 105 Q125 145 95 190 Q75 235 105 255" fill="none" stroke="#455a74" stroke-width="18" stroke-linecap="round"/>

      <!-- Amber acil durum vurgusu -->
      <path d="M105 115 Q122 150 97 185" fill="none" stroke="#f39c12" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

      <!-- Hortum ucu halkası (Artık animasyonla bütünleşik ve kopmuyor) -->
      <g>
        <rect x="101" y="258" width="8" height="14" rx="2" fill="#e67e22"/>
        <circle cx="105" cy="270" r="14" fill="none" stroke="#e67e22" stroke-width="7"/>
        <circle cx="105" cy="270" r="9" fill="none" stroke="#2c3e50" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- Logo metni -->
  <text x="100" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#34495e" letter-spacing="1">İMDAT</text>
  <text x="100" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">HORTUMU</text>
</svg>
